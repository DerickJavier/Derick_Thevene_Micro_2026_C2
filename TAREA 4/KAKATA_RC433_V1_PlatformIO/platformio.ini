; KAKATA RC-433 V1 - Control remoto 433MHz + WiFi (ESP32-S3)
; Proyecto PlatformIO con framework ESP-IDF
; Abrir esta carpeta en VS Code con la extension PlatformIO IDE instalada

[env:kakata_rc433]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espressifidf

; Flash de 16MB y tabla de particiones personalizada
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv

; Velocidad del monitor serie
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Opciones de configuracion del SDK (equivalente a sdkconfig.defaults)
; PlatformIO las lee desde sdkconfig.kakata_rc433 (sdkconfig.<NOMBRE_DEL_ENV>)
